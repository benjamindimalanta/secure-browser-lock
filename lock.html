<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Locked</title>
    <link rel="stylesheet" href="lock.css" />
  </head>
  <body>
    <main class="screen">
      <div class="panel">
        <div class="icon" aria-hidden="true">🔒</div>
        <h1>Locked</h1>
        <p class="subtitle">Enter PIN</p>
        <form id="unlock-form">
          <input
            type="password"
            id="pin"
            inputmode="numeric"
            maxlength="8"
            autocomplete="off"
            placeholder="PIN"
            aria-label="PIN"
            autofocus
          />
          <p id="error" class="error" hidden>Wrong PIN</p>
          <button type="submit" class="btn">Unlock</button>
        </form>
        <p class="note">Closing this window (✕) will quit Brave. Open Brave again to enter your PIN.</p>
      </div>
    </main>
    <script src="lock-hardening.js"></script>
    <script src="lock.js"></script>
  </body>
</html>
